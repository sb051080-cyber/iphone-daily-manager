<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>毎日の管理</title>
<style>
:root{
  --bg:#f4f6f8;--card:#fff;--text:#1f2937;--muted:#6b7280;--line:#d7dce2;
  --accent:#2563eb;--soft:#eef2ff;--danger:#b91c1c;--good:#15803d
}
*{box-sizing:border-box}
body{
  margin:0;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue","Segoe UI","Noto Sans JP",sans-serif;
  -webkit-text-size-adjust:100%
}
.wrap{max-width:520px;margin:0 auto;padding:14px 14px calc(28px + env(safe-area-inset-bottom))}
.header{padding-top:env(safe-area-inset-top)}
h1{font-size:28px;margin:4px 0}.date{color:var(--muted);margin-bottom:12px}
.card{
  background:var(--card);border:1px solid #e5e7eb;border-radius:18px;
  padding:16px;margin:12px 0;box-shadow:0 2px 10px rgba(0,0,0,.04)
}
h2{font-size:21px;margin:0 0 12px} h3{font-size:16px;margin:14px 0 8px}
input,select,textarea,button{font:inherit}
input[type=text],input[type=number],input[type=date],input[type=file],textarea,select{
  width:100%;min-height:48px;border:1px solid var(--line);border-radius:12px;
  padding:11px 12px;background:#fff;font-size:17px
}
textarea{min-height:82px;resize:vertical}
button{
  min-height:48px;border:0;border-radius:12px;padding:10px 14px;
  font-size:17px;font-weight:700;cursor:pointer
}
.primary{background:var(--accent);color:#fff}.secondary{background:#e8edf3;color:#111827}
.danger{background:#fee2e2;color:var(--danger)}.save{width:100%;margin-top:10px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.check{
  display:flex;align-items:center;gap:10px;min-height:54px;padding:10px 12px;
  border:1px solid var(--line);border-radius:12px;font-size:17px
}
input[type=checkbox]{width:24px;height:24px}
.category-row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.catbtn{background:#eef2f7;border:2px solid transparent}
.catbtn.active{background:var(--soft);border-color:var(--accent);color:#1d4ed8}
.plan-item,.todo-item,.food-item{
  border-top:1px solid #edf0f3;padding:12px 0;
  display:flex;align-items:flex-start;justify-content:space-between;gap:10px
}
.item-main{min-width:0;flex:1}.item-title{font-size:17px;word-break:break-word}
.meta{font-size:13px;color:var(--muted);margin-top:3px}
.smallbtn{min-height:40px;font-size:14px;padding:8px 10px}.done{text-decoration:line-through;color:var(--muted)}
.todo-add{display:grid;gap:8px}.status{font-size:13px;color:var(--good);min-height:18px;margin-top:7px}
.inline{display:grid;grid-template-columns:1fr auto;gap:8px}
.food-photo{width:92px;height:92px;object-fit:cover;border-radius:12px;border:1px solid #e5e7eb}
.food-left{display:flex;gap:10px;min-width:0;flex:1}
.note{background:#f8fafc;border-radius:12px;padding:10px;font-size:14px;color:#374151;margin-top:8px}
.section-note{font-size:13px;color:var(--muted);margin-top:-4px;margin-bottom:10px}
details{margin-top:10px}
@media(max-width:390px){.grid3{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
  <div class="header">
    <h1>毎日の管理</h1>
    <div id="todayLabel" class="date"></div>
  </div>

  <section class="card">
    <h2>今日の世話人さん</h2>
    <div class="inline">
      <select id="caregiverSelect"></select>
      <button class="secondary" onclick="addCaregiverName()">名前追加</button>
    </div>
    <textarea id="caregiverMemo" placeholder="一言メモ（任意）" style="margin-top:8px"></textarea>
    <button class="primary save" onclick="saveCaregiver()">保存</button>
    <div id="caregiverStatus" class="status"></div>
  </section>

  <section class="card">
    <h2>今日の予定</h2>
    <div class="category-row" id="todayCats"></div>
    <input id="todayPlanText" type="text" placeholder="予定を入力" style="margin-top:8px">
    <button class="primary save" onclick="addPlan('today')">今日の予定に追加</button>
    <div id="todayPlans" style="margin-top:8px"></div>
  </section>

  <section class="card">
    <h2>明日の予定</h2>
    <div class="category-row" id="tomorrowCats"></div>
    <input id="tomorrowPlanText" type="text" placeholder="明日の予定を入力" style="margin-top:8px">
    <button class="primary save" onclick="addPlan('tomorrow')">明日の予定に追加</button>
    <div id="tomorrowPlans" style="margin-top:8px"></div>
  </section>

  <section class="card">
    <h2>訪問看護</h2>
    <div class="section-note">看護師さんの名前を選んで記録できます。</div>
    <div class="inline">
      <select id="nurseSelect"></select>
      <button class="secondary" onclick="addNurseName()">名前追加</button>
    </div>
    <textarea id="nurseMemo" placeholder="一言メモ（任意）" style="margin-top:8px"></textarea>
    <button class="primary save" onclick="saveNurse()">今日の訪問看護を保存</button>
    <div id="nurseStatus" class="status"></div>
  </section>

  <section class="card">
    <h2>服薬</h2>
    <div class="grid2">
      <label class="check"><input id="medMorning" type="checkbox">朝</label>
      <label class="check"><input id="medNoon" type="checkbox">昼</label>
      <label class="check"><input id="medEvening" type="checkbox">夕</label>
      <label class="check"><input id="medBed" type="checkbox">寝る前</label>
    </div>
    <button class="primary save" onclick="saveDaily()">保存</button>
  </section>

  <section class="card">
    <h2>血圧・脈拍</h2>
    <div class="grid3">
      <input id="bpHigh" type="number" inputmode="numeric" placeholder="上">
      <input id="bpLow" type="number" inputmode="numeric" placeholder="下">
      <input id="pulse" type="number" inputmode="numeric" placeholder="脈拍">
    </div>
    <button class="primary save" onclick="saveDaily()">保存</button>
  </section>

  <section class="card">
    <h2>排便</h2>
    <div class="grid2">
      <select id="bowel">
        <option value="">未入力</option>
        <option value="なし">なし</option>
        <option value="あり">あり</option>
      </select>
      <input id="bowelCount" type="number" min="0" inputmode="numeric" placeholder="回数">
    </div>
    <button class="primary save" onclick="saveDaily()">保存</button>
  </section>

  <section class="card">
    <h2>食事記録</h2>
    <div class="section-note">写真＋一言メモだけ。後から削除できます。</div>
    <select id="mealType">
      <option>朝食</option><option>昼食</option><option>夕食</option><option>間食</option>
    </select>
    <input id="foodPhoto" type="file" accept="image/*" capture="environment" style="margin-top:8px">
    <input id="foodMemo" type="text" placeholder="一言メモ" style="margin-top:8px">
    <button class="primary save" onclick="addFood()">食事を保存</button>
    <div id="foodList" style="margin-top:8px"></div>
  </section>

  <section class="card">
    <h2>To Do</h2>
    <div class="todo-add">
      <input id="todoText" type="text" placeholder="例：洗濯する">
      <input id="todoDate" type="date">
      <button class="primary" onclick="addTodo()">追加</button>
    </div>
    <div id="todoList" style="margin-top:8px"></div>
    <details><summary>完了済みを見る</summary><div id="doneList"></div></details>
  </section>

  <section class="card">
    <h2>今日のメモ</h2>
    <textarea id="memo" placeholder="必要な時だけ入力"></textarea>
    <button class="primary save" onclick="saveDaily()">保存</button>
    <div id="status" class="status"></div>
  </section>
</div>

<script>
const CATS=['医療','就労','福祉','生活','私用'];
let selected={today:'医療',tomorrow:'医療'};
const pad=n=>String(n).padStart(2,'0');
const fmt=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const today=new Date(),tomorrow=new Date(today);tomorrow.setDate(today.getDate()+1);
const todayKey=fmt(today),tomorrowKey=fmt(tomorrow);
todayLabel.textContent=`${today.getFullYear()}年${today.getMonth()+1}月${today.getDate()}日`;
todoDate.value=todayKey;

function getDaily(date){return JSON.parse(localStorage.getItem('daily:'+date)||'{}')}
function setDaily(date,obj){localStorage.setItem('daily:'+date,JSON.stringify(obj))}
function flash(id,text='保存しました'){const el=document.getElementById(id);el.textContent=text;setTimeout(()=>el.textContent='',1300)}

function getNames(key){return JSON.parse(localStorage.getItem(key)||'[]')}
function setNames(key,a){localStorage.setItem(key,JSON.stringify(a))}
function fillNames(){
  const configs=[['caregiverNames','caregiverSelect','世話人さんを選択'],['nurseNames','nurseSelect','看護師さんを選択']];
  configs.forEach(([key,id,placeholder])=>{
    const s=document.getElementById(id), cur=s.value, arr=getNames(key);
    s.innerHTML=`<option value="">${placeholder}</option>`;
    arr.forEach(n=>{const o=document.createElement('option');o.value=n;o.textContent=n;s.appendChild(o)});
    if(arr.includes(cur))s.value=cur;
  });
}
function promptAddName(key,label){
  const n=prompt(label+'の名前を入力してください');
  if(!n)return;
  const arr=getNames(key);
  if(!arr.includes(n.trim())){arr.push(n.trim());setNames(key,arr)}
  fillNames();
}
function addCaregiverName(){promptAddName('caregiverNames','世話人さん')}
function addNurseName(){promptAddName('nurseNames','看護師さん')}

function saveCaregiver(){
  const d=getDaily(todayKey);
  d.caregiver={name:caregiverSelect.value,memo:caregiverMemo.value};
  setDaily(todayKey,d); flash('caregiverStatus');
}
function saveNurse(){
  const d=getDaily(todayKey);
  d.nurse={name:nurseSelect.value,memo:nurseMemo.value};
  setDaily(todayKey,d); flash('nurseStatus');
}

function renderCats(which){
  const el=document.getElementById(which+'Cats');el.innerHTML='';
  CATS.forEach(c=>{
    const b=document.createElement('button');
    b.className='catbtn'+(selected[which]===c?' active':'');b.textContent=c;
    b.onclick=()=>{selected[which]=c;renderCats(which)};el.appendChild(b);
  })
}
function getPlans(date){const d=getDaily(date);return Array.isArray(d.plans)?d.plans:[]}
function savePlans(date,plans){const d=getDaily(date);d.plans=plans;setDaily(date,d)}
function addPlan(which){
  const date=which==='today'?todayKey:tomorrowKey;
  const input=document.getElementById(which+'PlanText'),text=input.value.trim(); if(!text)return;
  const plans=getPlans(date);plans.push({id:Date.now(),cat:selected[which],text});
  savePlans(date,plans);input.value='';renderPlans(which)
}
function deletePlan(which,id){
  const date=which==='today'?todayKey:tomorrowKey;
  savePlans(date,getPlans(date).filter(x=>x.id!==id));renderPlans(which)
}
function renderPlans(which){
  const date=which==='today'?todayKey:tomorrowKey, el=document.getElementById(which+'Plans'), plans=getPlans(date);
  el.innerHTML='';
  if(!plans.length){el.innerHTML='<div class="meta">予定はまだありません。</div>';return}
  plans.forEach(x=>{
    const div=document.createElement('div');div.className='plan-item';
    div.innerHTML='<div class="item-main"><div class="item-title"></div><div class="meta"></div></div><button class="danger smallbtn">削除</button>';
    div.querySelector('.item-title').textContent=x.text;div.querySelector('.meta').textContent=x.cat;
    div.querySelector('button').onclick=()=>deletePlan(which,x.id);el.appendChild(div)
  })
}

function saveDaily(){
  const d=getDaily(todayKey);
  Object.assign(d,{
    medMorning:medMorning.checked,medNoon:medNoon.checked,medEvening:medEvening.checked,medBed:medBed.checked,
    bpHigh:bpHigh.value,bpLow:bpLow.value,pulse:pulse.value,bowel:bowel.value,bowelCount:bowelCount.value,memo:memo.value
  });
  setDaily(todayKey,d);flash('status')
}

function getTodos(){return JSON.parse(localStorage.getItem('todos')||'[]')}
function setTodos(a){localStorage.setItem('todos',JSON.stringify(a))}
function addTodo(){
  const text=todoText.value.trim();if(!text)return;
  const a=getTodos();a.push({id:Date.now(),text,due:todoDate.value||todayKey,done:false});
  setTodos(a);todoText.value='';renderTodos()
}
function doneTodo(id){const a=getTodos(),x=a.find(t=>t.id===id);if(x)x.done=true;setTodos(a);renderTodos()}
function restoreTodo(id){const a=getTodos(),x=a.find(t=>t.id===id);if(x)x.done=false;setTodos(a);renderTodos()}
function deleteTodo(id){setTodos(getTodos().filter(t=>t.id!==id));renderTodos()}
function renderTodos(){
  const all=getTodos(),active=all.filter(x=>!x.done),done=all.filter(x=>x.done);todoList.innerHTML='';doneList.innerHTML='';
  if(!active.length)todoList.innerHTML='<div class="meta">未完了のTo Doはありません。</div>';
  active.forEach(x=>{
    const div=document.createElement('div');div.className='todo-item';
    div.innerHTML='<div class="item-main"><div class="item-title"></div><div class="meta"></div></div><div><button class="secondary smallbtn">完了</button><button class="danger smallbtn" style="margin-top:6px">削除</button></div>';
    div.querySelector('.item-title').textContent=x.text;div.querySelector('.meta').textContent='期限：'+x.due;
    const bs=div.querySelectorAll('button');bs[0].onclick=()=>doneTodo(x.id);bs[1].onclick=()=>deleteTodo(x.id);todoList.appendChild(div)
  });
  if(!done.length)doneList.innerHTML='<div class="meta">完了履歴はありません。</div>';
  done.forEach(x=>{
    const div=document.createElement('div');div.className='todo-item';
    div.innerHTML='<div class="item-main"><div class="item-title done"></div><div class="meta"></div></div><button class="secondary smallbtn">戻す</button>';
    div.querySelector('.item-title').textContent=x.text;div.querySelector('.meta').textContent='期限：'+x.due;
    div.querySelector('button').onclick=()=>restoreTodo(x.id);doneList.appendChild(div)
  })
}

/* IndexedDB for meal photos */
let db;
const dbReq=indexedDB.open('dailyManagerDB',1);
dbReq.onupgradeneeded=e=>{
  db=e.target.result;
  if(!db.objectStoreNames.contains('foods'))db.createObjectStore('foods',{keyPath:'id'});
};
dbReq.onsuccess=e=>{db=e.target.result;renderFoods()};
function addFood(){
  const file=foodPhoto.files[0];
  if(!file){alert('写真を選んでください');return}
  const reader=new FileReader();
  reader.onload=()=>{
    const item={id:Date.now(),date:todayKey,time:new Date().toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit'}),meal:mealType.value,memo:foodMemo.value.trim(),photo:reader.result};
    const tx=db.transaction('foods','readwrite');tx.objectStore('foods').put(item);
    tx.oncomplete=()=>{foodPhoto.value='';foodMemo.value='';renderFoods()}
  };
  reader.readAsDataURL(file)
}
function deleteFood(id){
  const tx=db.transaction('foods','readwrite');tx.objectStore('foods').delete(id);tx.oncomplete=renderFoods
}
function renderFoods(){
  if(!db)return;
  const tx=db.transaction('foods','readonly'), req=tx.objectStore('foods').getAll();
  req.onsuccess=()=>{
    const items=req.result.filter(x=>x.date===todayKey).sort((a,b)=>b.id-a.id);
    foodList.innerHTML='';
    if(!items.length){foodList.innerHTML='<div class="meta">今日の食事記録はありません。</div>';return}
    items.forEach(x=>{
      const div=document.createElement('div');div.className='food-item';
      div.innerHTML='<div class="food-left"><img class="food-photo"><div class="item-main"><div class="item-title"></div><div class="meta"></div><div class="note" style="display:none"></div></div></div><button class="danger smallbtn">削除</button>';
      div.querySelector('img').src=x.photo;div.querySelector('.item-title').textContent=x.meal;
      div.querySelector('.meta').textContent=x.time;
      if(x.memo){const n=div.querySelector('.note');n.style.display='block';n.textContent=x.memo}
      div.querySelector('button').onclick=()=>deleteFood(x.id);foodList.appendChild(div)
    })
  }
}

function load(){
  const d=getDaily(todayKey);
  medMorning.checked=!!d.medMorning;medNoon.checked=!!d.medNoon;medEvening.checked=!!d.medEvening;medBed.checked=!!d.medBed;
  bpHigh.value=d.bpHigh||'';bpLow.value=d.bpLow||'';pulse.value=d.pulse||'';
  bowel.value=d.bowel||'';bowelCount.value=d.bowelCount||'';memo.value=d.memo||'';
  fillNames();
  if(d.caregiver){caregiverSelect.value=d.caregiver.name||'';caregiverMemo.value=d.caregiver.memo||''}
  if(d.nurse){nurseSelect.value=d.nurse.name||'';nurseMemo.value=d.nurse.memo||''}
  renderCats('today');renderCats('tomorrow');renderPlans('today');renderPlans('tomorrow');renderTodos()
}
load();
</script>
</body>
</html>
